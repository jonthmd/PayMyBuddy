<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" href="../static/css/profileStyle.css">
</head>
<body>

<header>
    <nav>
        <ul class="navbar">
            <span>Pay My Buddy</span>
            <div class="menu">
                <a th:href="@{/dashboard}">Transférer</a>
                <a class="profile" href="#">Profil</a>
                <a href="#">Ajouter relation</a>
                <a th:href="@{/logout}">Se déconnecter</a>
            </div>
        </ul>
    </nav>
</header>

<main>
    <section>
        <form action="" method="post">
        <p class="fields">
            <label for="username">Username</label>
            <input class="username" type="text" id="username" name="username" placeholder="@username">
        </p>
        <p class="fields">
            <label for="mail">Mail</label>
            <input class="mail" type="email" id="mail" name="mail" placeholder="nom@domain.com">
        </p>
        <p class="fields">
            <label for="password">Mot de passe</label>
            <input class="password" type="password" id="password" name="password" placeholder="mot de passe">
        </p>
        <div>
            <input class="button" type="submit" value="Modifier">
        </div>

        </form>
    </section>
</main>
</body>
</html>
