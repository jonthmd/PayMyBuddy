<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connections</title>
    <link rel="stylesheet" th:href="@{/css/connectionsStyle.css}">
</head>
<body>

<header>
    <nav>
        <div class="navbar">
            <span class="logo">Pay My Buddy</span>

            <div class="menu">
                <a th:href="@{/dashboard}">Transférer</a>
                <a th:href="@{/profile}">Profil</a>
                <a class="connection" th:href="@{/connections}">Ajouter relation</a>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit" class="logout">Se déconnecter</button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main>
    <section class="add">
        <form th:action="@{/connections}" method="post" th:object="${addConnectionDTO}">
            <label>Chercher une relation<br>
                <input class="mail" type="text" th:field="*{email}" placeholder="Saisir une adresse mail">
                <input class="button" type="submit" value="Ajouter">
            </label>
        </form>

    </section>
    <br>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <br>
    <div class="message" th:if="${message}" th:text="${message}"></div>

</main>
</body>
</html>
