<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Transaction</title>
    <link href="../static/css/transactionStyle.css" rel="stylesheet">
</head>

<body>

<header>
    <nav>
        <ul class="navbar">
            <span>Pay My Buddy</span>
            <div class="menu">
                <a class="transfer" href="#">Transférer</a>
                <a href="#">Profil</a>
                <a href="#">Ajouter relation</a>
                <a href="#">Se déconnecter</a>
            </div>
        </ul>
    </nav>
</header>

<main>

    <section>
        <form method="get" action="">
            <div>
                <label for="connection"></label>
                <select name="connection" id="connection">
                    <option value="default"> Sélectionner une relation</option>
                    <option value="userA"> user A </option>
                    <option value="userB"> user B </option>
                </select>
            </div>
            <div>
                <label>
                    <input class="description" type="text" name="description" placeholder="Description">
                </label>
            </div>
            <div>
                <label class="amount">
                    <input class="quantity" type="number" min="0" max="500" step="10" value="0">
                    <span class="currency">€</span>
                </label>
            </div>
            <div>
                <input class="submit" type="submit" value="Payer">
            </div>
        </form>
    </section>

    <section class="view">
        <div>
            <h2>Mes transactions</h2>
        </div>
        <table>
            <thead>
            <tr class="header">
                <th>Relations</th>
                <th>Description</th>
                <th class="right">Montant</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Test</td>
                <td>TEST</td>
                <td class="right">iofhizqfnirfnaopirfn</td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

</body>

</html>
