<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link href="../static/css/signInUpStyle.css" rel="stylesheet">
</head>
<body>
<header>

</header>
<main>
    <section>
        <form class="form" action="" method="post">
            <div class="title">
                <h2>Pay My Buddy</h2>
            </div>
            <div>
                <label>
                    <input class="username" type="text" name="username" placeholder="Username" required>
                </label>
            </div>
            <div>
                <label>
                    <input class="mail" type="text" name="mail" placeholder="Mail" required>
                </label>
            </div>
            <div>
                <label>
                    <input class="password" type="password" name="motDePasse" placeholder="Mot de passe" required>
                </label>
            </div>
            <div>
                <input class="submit" type="submit" value="S'inscrire">
            </div>
            <p>
                <a href="signIn.html">Déjà un compte ?</a>
            </p>
        </form>
    </section>
</main>
</body>
